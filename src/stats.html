<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.A.V.I.A. - System Stats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #0a0c12; color: #e0e0e0; margin: 0; padding: 0; overflow-x: hidden; font-family: 'Share Tech Mono', monospace; }
    .stats-header { background: linear-gradient(135deg, #0d1117 0%, #161b22 100%); border-bottom: 1px solid #00ff8833; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .stats-header h1 { font-family: 'Orbitron', sans-serif; color: #00ff88; font-size: 18px; margin: 0; letter-spacing: 2px; }
    .stats-header .sys-info { font-size: 11px; color: #888; }
    .stats-header .sys-info span { color: #00ff88; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; padding: 12px; }
    .chart-card { background: linear-gradient(135deg, #0d1117 0%, #111820 100%); border: 1px solid #1e2a3a; border-radius: 8px; padding: 12px; position: relative; overflow: hidden; }
    .chart-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
    .chart-card.cpu { --accent: #00ff88; }
    .chart-card.ram { --accent: #00ccff; }
    .chart-card.net-in { --accent: #ff6b35; }
    .chart-card.net-out { --accent: #ff3366; }
    .chart-card.gpu { --accent: #aa66ff; }
    .chart-card.disk-io { --accent: #ffcc00; }
    .chart-card.temp { --accent: #ff4444; }
    .chart-card.per-core { --accent: #00ffcc; }
    .chart-title { font-family: 'Orbitron', sans-serif; font-size: 11px; color: var(--accent); letter-spacing: 1px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    .chart-title .value { font-size: 20px; font-weight: 800; }
    .chart-canvas { width: 100%; height: 120px; display: block; }
    .stats-bottom { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; padding: 0 12px 12px; }
    .panel { background: linear-gradient(135deg, #0d1117 0%, #111820 100%); border: 1px solid #1e2a3a; border-radius: 8px; padding: 12px; }
    .panel-title { font-family: 'Orbitron', sans-serif; font-size: 11px; color: #00ff88; letter-spacing: 1px; margin-bottom: 8px; border-bottom: 1px solid #1e2a3a; padding-bottom: 6px; }
    .process-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .process-table th { color: #00ff88; text-align: left; padding: 4px 8px; border-bottom: 1px solid #1e2a3a; font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 1px; }
    .process-table td { padding: 3px 8px; border-bottom: 1px solid #0d1117; }
    .process-table tr:hover td { background: #00ff8810; }
    .disk-bar { margin-bottom: 8px; }
    .disk-bar-label { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 3px; }
    .disk-bar-track { height: 8px; background: #1a1a2e; border-radius: 4px; overflow: hidden; }
    .disk-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
    .disk-bar-fill.low { background: linear-gradient(90deg, #00ff88, #00cc66); }
    .disk-bar-fill.mid { background: linear-gradient(90deg, #ffcc00, #ff9900); }
    .disk-bar-fill.high { background: linear-gradient(90deg, #ff6b35, #ff3366); }
    .net-stat { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #0d1117; font-size: 11px; }
    .net-stat .label { color: #888; }
    .net-stat .val { color: #00ff88; }
    @media (max-width: 900px) { .stats-grid { grid-template-columns: 1fr 1fr; } .stats-bottom { grid-template-columns: 1fr; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="stats-header">
    <h1><i class="fas fa-chart-line"></i> SYSTEM STATS</h1>
    <div class="sys-info" id="sys-info">
      <span id="stat-platform">-</span> |
      <span id="stat-arch">-</span> |
      CPU: <span id="stat-cpu-model">-</span> |
      Cores: <span id="stat-cores">-</span> |
      RAM: <span id="stat-total-ram">-</span> GB |
      Uptime: <span id="stat-uptime">-</span>
    </div>
  </div>

  <!-- Charts Grid -->
  <div class="stats-grid">
    <!-- CPU -->
    <div class="chart-card cpu">
      <div class="chart-title">
        <span><i class="fas fa-microchip"></i> NEURAL CORE LOAD</span>
        <span class="value" id="cpu-val">0%</span>
      </div>
      <canvas class="chart-canvas" id="chart-cpu"></canvas>
    </div>

    <!-- RAM -->
    <div class="chart-card ram">
      <div class="chart-title">
        <span><i class="fas fa-memory"></i> MEMORY ALLOCATION</span>
        <span class="value" id="ram-val">0 GB</span>
      </div>
      <canvas class="chart-canvas" id="chart-ram"></canvas>
    </div>

    <!-- Network In -->
    <div class="chart-card net-in">
      <div class="chart-title">
        <span><i class="fas fa-arrow-down"></i> NETWORK IN</span>
        <span class="value" id="net-in-val">0 KB/s</span>
      </div>
      <canvas class="chart-canvas" id="chart-net-in"></canvas>
    </div>

    <!-- Network Out -->
    <div class="chart-card net-out">
      <div class="chart-title">
        <span><i class="fas fa-arrow-up"></i> NETWORK OUT</span>
        <span class="value" id="net-out-val">0 KB/s</span>
      </div>
      <canvas class="chart-canvas" id="chart-net-out"></canvas>
    </div>

    <!-- GPU -->
    <div class="chart-card gpu">
      <div class="chart-title">
        <span><i class="fas fa-gamepad"></i> GPU UTILIZATION</span>
        <span class="value" id="gpu-val">0%</span>
      </div>
      <canvas class="chart-canvas" id="chart-gpu"></canvas>
    </div>

    <!-- Disk I/O -->
    <div class="chart-card disk-io">
      <div class="chart-title">
        <span><i class="fas fa-hdd"></i> DISK I/O</span>
        <span class="value" id="disk-io-val">0 MB/s</span>
      </div>
      <canvas class="chart-canvas" id="chart-disk-io"></canvas>
    </div>

    <!-- Temperature -->
    <div class="chart-card temp">
      <div class="chart-title">
        <span><i class="fas fa-thermometer-half"></i> TEMPERATURE</span>
        <span class="value" id="temp-val">- °C</span>
      </div>
      <canvas class="chart-canvas" id="chart-temp"></canvas>
    </div>

    <!-- Per-Core CPU -->
    <div class="chart-card per-core" style="grid-column: span 2;">
      <div class="chart-title">
        <span><i class="fas fa-stream"></i> PER-CORE USAGE</span>
      </div>
      <canvas class="chart-canvas" id="chart-per-core" style="height: 80px;"></canvas>
    </div>
  </div>

  <!-- Bottom: Processes + Disks -->
  <div class="stats-bottom">
    <div class="panel">
      <div class="panel-title"><i class="fas fa-list"></i> ACTIVE PROCESSES</div>
      <table class="process-table">
        <thead><tr><th>NAME</th><th>PID</th><th>CPU s</th><th>MEM MB</th></tr></thead>
        <tbody id="process-list"></tbody>
      </table>
    </div>
    <div class="panel">
      <div class="panel-title"><i class="fas fa-hdd"></i> STORAGE</div>
      <div id="disk-bars"></div>
      <div class="panel-title" style="margin-top: 12px;"><i class="fas fa-network-wired"></i> INTERFACES</div>
      <div id="net-interfaces"></div>
    </div>
  </div>

  <audio id="audio-click" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-84.wav" preload="auto"></audio>
  <audio id="audio-beep" src="https://assets.mixkit.co/active_storage/sfx/951/951-84.wav" preload="auto"></audio>

  <script src="shared.js"></script>
  <script src="stats.js"></script>
  <script src="page-voice.js"></script>
  <script src="nav-windows.js"></script>
</body>
</html>
