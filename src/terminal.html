<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.A.V.I.A. - Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body { overflow: hidden; display: flex; flex-direction: column; height: 100vh; margin: 0; }

    .term-toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: rgba(10, 12, 18, 0.95);
      border-bottom: 1px solid rgba(0, 243, 255, 0.1);
      flex-shrink: 0;
      z-index: 100;
    }

    .term-toolbar-group {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .term-toolbar-sep {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.08);
      margin: 0 6px;
    }

    .ttb-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.5);
      width: 28px; height: 26px;
      border-radius: 4px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      transition: all 0.15s;
    }
    .ttb-btn:hover { background: rgba(0, 243, 255, 0.1); border-color: var(--accent-cyan); color: #fff; }
    .ttb-btn.active { background: rgba(0, 243, 255, 0.15); border-color: var(--accent-cyan); color: var(--accent-cyan); }
    .ttb-btn.danger:hover { background: rgba(255, 60, 60, 0.15); border-color: var(--accent-red); color: var(--accent-red); }

    .ttb-label {
      font-family: var(--font-hud);
      font-size: 9px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.3);
      margin-right: 6px;
    }

    /* ── Tab Bar ─────────────────────────────────────── */
    .term-tab-bar {
      display: flex;
      align-items: stretch;
      background: rgba(8, 10, 16, 0.98);
      border-bottom: 1px solid rgba(0, 243, 255, 0.08);
      overflow-x: auto;
      flex-shrink: 0;
      height: 32px;
    }
    .term-tab-bar::-webkit-scrollbar { height: 0; }

    .term-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      border-right: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.15s;
      white-space: nowrap;
      position: relative;
      min-width: 80px;
    }
    .term-tab:hover { background: rgba(255, 255, 255, 0.03); color: rgba(255, 255, 255, 0.6); }
    .term-tab.active {
      background: rgba(0, 243, 255, 0.06);
      color: var(--accent-cyan);
      border-bottom: 2px solid var(--accent-cyan);
    }
    .term-tab .tab-close {
      opacity: 0;
      width: 16px; height: 16px;
      border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px;
      transition: all 0.1s;
    }
    .term-tab:hover .tab-close { opacity: 0.5; }
    .term-tab .tab-close:hover { opacity: 1; background: rgba(255, 60, 60, 0.3); color: var(--accent-red); }

    .term-tab-add {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.25);
      font-size: 14px;
      transition: all 0.15s;
    }
    .term-tab-add:hover { color: var(--accent-cyan); background: rgba(0, 243, 255, 0.06); }

    /* ── Split Container ─────────────────────────────── */
    .split-container {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }
    .split-container.horizontal { flex-direction: row; }
    .split-container.vertical { flex-direction: column; }

    .split-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 200px;
      min-height: 100px;
      position: relative;
    }

    .split-divider {
      flex-shrink: 0;
      background: rgba(0, 243, 255, 0.08);
      transition: background 0.15s;
      z-index: 10;
    }
    .split-container.horizontal .split-divider {
      width: 4px;
      cursor: col-resize;
    }
    .split-container.vertical .split-divider {
      height: 4px;
      cursor: row-resize;
    }
    .split-divider:hover { background: var(--accent-cyan); }

    .pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 10px;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(0, 243, 255, 0.06);
      flex-shrink: 0;
      height: 28px;
    }
    .pane-header-title {
      font-family: var(--font-mono);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.5px;
    }
    .pane-header-actions {
      display: flex;
      gap: 4px;
    }
    .pane-action-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.3);
      width: 20px; height: 20px;
      border-radius: 3px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
      transition: all 0.1s;
    }
    .pane-action-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }

    .xterm-container {
      flex: 1;
      overflow: hidden;
      padding: 4px;
    }

    /* ── Status Bar ──────────────────────────────────── */
    .term-status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 12px;
      background: rgba(10, 12, 18, 0.95);
      border-top: 1px solid rgba(0, 243, 255, 0.08);
      font-family: var(--font-mono);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.3);
      flex-shrink: 0;
      height: 22px;
    }
    .term-status-bar .status-left { display: flex; gap: 12px; }
    .term-status-bar .status-right { display: flex; gap: 12px; }
    .status-item { display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; }
    .status-dot.green { background: #00ff88; box-shadow: 0 0 4px #00ff88; }
    .status-dot.yellow { background: #ffc800; box-shadow: 0 0 4px #ffc800; }
    .status-dot.red { background: #ff3c3c; box-shadow: 0 0 4px #ff3c3c; }
    .status-dot.cyan { background: var(--accent-cyan); box-shadow: 0 0 4px var(--accent-cyan); }

    /* ── Command Palette Overlay ──────────────────────── */
    .cmd-palette-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 80px;
    }
    .cmd-palette-overlay.visible { display: flex; }

    .cmd-palette {
      width: 500px;
      max-height: 400px;
      background: rgba(12, 14, 22, 0.98);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 243, 255, 0.05);
      overflow: hidden;
    }

    .cmd-palette-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(0, 243, 255, 0.1);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 14px;
      padding: 14px 18px;
      outline: none;
    }
    .cmd-palette-input::placeholder { color: rgba(255, 255, 255, 0.2); }

    .cmd-palette-list {
      max-height: 340px;
      overflow-y: auto;
      padding: 6px;
    }
    .cmd-palette-list::-webkit-scrollbar { width: 4px; }
    .cmd-palette-list::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.2); border-radius: 2px; }

    .cmd-palette-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.1s;
    }
    .cmd-palette-item:hover, .cmd-palette-item.selected {
      background: rgba(0, 243, 255, 0.08);
    }
    .cmd-palette-item .cmd-icon {
      width: 20px;
      text-align: center;
      color: var(--accent-cyan);
      font-size: 12px;
    }
    .cmd-palette-item .cmd-label {
      font-family: var(--font-mono);
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
    }
    .cmd-palette-item .cmd-shortcut {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <header id="hud-header" style="height:36px;min-height:36px;">
    <div class="header-left">
      <span class="system-status-indicator blink"></span>
      <span class="system-title">S.A.V.I.A</span>
      <span class="system-version">v4.0.0</span>
    </div>
    <div class="header-center">
      <span class="breadcrumb">SYSTEM_ROOT // TERMINAL // MULTI_PANE</span>
    </div>
    <div class="header-right">
      <button class="hud-action-btn-primary" onclick="window.location.href='index.html'" style="font-size:9px;padding:4px 10px;margin-right:10px;"><i class="fas fa-comment-dots"></i> AI CHAT</button>
      <div class="window-controls">
        <button class="win-btn" id="btn-minimize" title="Minimize">&#9472;</button>
        <button class="win-btn" id="btn-maximize" title="Maximize">&#9633;</button>
        <button class="win-btn" id="btn-close" title="Close">&#10005;</button>
      </div>
    </div>
  </header>

  <div class="term-toolbar">
    <span class="ttb-label">TERMINAL</span>
    <div class="term-toolbar-group">
      <button class="ttb-btn" id="btn-new-tab" title="New Tab (Ctrl+T)"><i class="fas fa-plus"></i></button>
      <button class="ttb-btn danger" id="btn-close-tab" title="Close Tab (Ctrl+W)"><i class="fas fa-times"></i></button>
    </div>
    <div class="term-toolbar-sep"></div>
    <div class="term-toolbar-group">
      <button class="ttb-btn" id="btn-split-h" title="Split Horizontal"><i class="fas fa-arrows-alt-h"></i></button>
      <button class="ttb-btn" id="btn-split-v" title="Split Vertical"><i class="fas fa-arrows-alt-v"></i></button>
    </div>
    <div class="term-toolbar-sep"></div>
    <div class="term-toolbar-group">
      <button class="ttb-btn" id="btn-palette" title="Command Palette (Ctrl+Shift+P)"><i class="fas fa-terminal"></i></button>
      <button class="ttb-btn" id="btn-voice-cmd" title="Voice Command"><i class="fas fa-microphone"></i></button>
    </div>
    <div style="flex:1"></div>
    <div class="term-toolbar-group">
      <button class="ttb-btn" id="btn-focus-left" title="Focus Left"><i class="fas fa-chevron-left"></i></button>
      <button class="ttb-btn" id="btn-focus-right" title="Focus Right"><i class="fas fa-chevron-right"></i></button>
      <button class="ttb-btn" id="btn-focus-up" title="Focus Up"><i class="fas fa-chevron-up"></i></button>
      <button class="ttb-btn" id="btn-focus-down" title="Focus Down"><i class="fas fa-chevron-down"></i></button>
    </div>
  </div>

  <div class="term-tab-bar" id="tab-bar">
    <div class="term-tab-add" id="btn-add-tab" title="New Tab"><i class="fas fa-plus"></i></div>
  </div>

  <div class="split-container horizontal" id="split-root">
    <!-- Panes injected by JS -->
  </div>

  <div class="term-status-bar">
    <div class="status-left">
      <div class="status-item"><span class="status-dot green"></span> PTY ACTIVE</div>
      <div class="status-item" id="status-tabs">TABS: 1</div>
      <div class="status-item" id="status-panes">PANES: 1</div>
    </div>
    <div class="status-right">
      <div class="status-item" id="status-focus">FOCUS: —</div>
      <div class="status-item" id="status-cwd">CWD: —</div>
    </div>
  </div>

  <!-- Command Palette -->
  <div class="cmd-palette-overlay" id="cmd-palette-overlay">
    <div class="cmd-palette">
      <input type="text" class="cmd-palette-input" id="cmd-palette-input" placeholder="Type a command or action..." autocomplete="off" />
      <div class="cmd-palette-list" id="cmd-palette-list"></div>
    </div>
  </div>

  <div id="hud-scanlines"></div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="shared.js"></script>
  <script src="telemetry.js"></script>
  <script src="commander.js"></script>
  <script src="page-voice.js"></script>
  <script src="nav-windows.js"></script>
</body>
</html>
